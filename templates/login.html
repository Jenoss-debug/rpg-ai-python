{% extends "base.html" %}

{% block title %}Connexion - Médiéval Relais{% endblock %}

{% block body_class %}auth-page{% endblock %}

{% block main_class %}login-main{% endblock %}

{% block content %}
<section class="login-container" aria-labelledby="login-title">
    <p class="eyebrow">Médiéval Relais</p>
    <h1 id="login-title">Connexion</h1>

    {% if erreur %}
    <p class="erreur" role="alert">{{ erreur }}</p>
    {% endif %}

    <form action="/login" method="post">
        <label for="identifiant">Identifiant ou e-mail</label>
        <input type="text" id="identifiant" name="identifiant" required autocomplete="username">

        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password">

        <button type="submit">Se connecter</button>
    </form>
</section>
{% endblock %}
