<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Angémoniaque</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="login-container">
        <h1>Angémoniaque</h1>
        <h2>Connexion</h2>

        {% if erreur %}
        <p class="erreur">{{ erreur }}</p>
        {% endif %}

        <form action="/login" method="post">
            <label for="identifiant">Identifiant ou e-mail</label>
            <input type="text" id="identifiant" name="identifiant" required autocomplete="username">

            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password">

            <button type="submit">Se connecter</button>
        </form>
    </main>

</body>

</html>
